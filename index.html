<head>
	<div><a href="./thue_morse.html" class="LINK" style="color: #000;">Thue-Morse 31-TET Visualizer</a></div>
	<script>
		var r = 127,
			g = 127,
			b = 127;
		setInterval(function() {
			r = (Math.random()*256)|0;
			g = (Math.random()*256)|0;
			b = (Math.random()*256)|0;
			document.body.style.background = "rgb(" + r + "," + g + "," + b + ")";
			const inverted = "rgb(" + (255 - r) + "," + (255 - g) + "," + (255 - b) + ")";
			for(const link of document.getElementsByClassName("LINK")) {
				link.style.color = inverted;
			}
		}, 1000);
	</script>
</head>
<body> </body>
